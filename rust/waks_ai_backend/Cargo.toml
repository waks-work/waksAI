[package]
name = "waks_ai_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Core Web Framework ---
axum = { version = "0.7", features = ["macros", "json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
futures = "0.3"

# --- Serialization / Deserialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Time & Utilities ---
chrono = { version = "0.4", features = ["serde", "clock"] }
once_cell = "1.20"
anyhow = "1.0"

# --- Database Layer (SQLx + SQLite) ---
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "chrono", "macros"] }

# --- Async Networking ---
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }

# --- Tracing & Logging ---
tracing = "0.1"
tracing-subscriber = "0.3"

# --- Async Utilities ---
async-stream = "0.3"
async-trait = "0.1.68"

# --- uuid ----
uuid = { version = "1.8", features = ["v4", "serde"] }

# --- Notify ---
notify = "8"
